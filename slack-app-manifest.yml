display_information:
  name: whip
  description: Join requests and movie requests
features:
  bot_user:
    display_name: whip
    always_online: true
  slash_commands:
    - command: /joinprvt
      description: Request to join the private channel
      should_escape: false
    - command: /join
      description: Join the public channel
      should_escape: false
    - command: /movierequest
      description: Request a movie (or "list" to see requests)
      usage_hint: "<movie title>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:manage
      - groups:write
      - users:read
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
